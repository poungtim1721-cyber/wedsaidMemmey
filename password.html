<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน</title>

        <link rel="stylesheet" href="/css/styled.css">
</head>
<body>
    <div class="fullscreen-bg"></div>
    <div class="right-side">
    
    <div id="loginSection">
        <p><h2>ตั้งรหัสผ่านใหม่</h1></p>
        <div class="forgot-container">
             <div class="textbox">
                <input id="LoginUser" required type="text" placeholder=" " />
                <label>ชื่อผู้ใช้ / Email / หมายเลขโทรศัพท์</label>
        </div>
        <button class="action-btn">ต่อไป</button>
        <a href="index.html" class="forgot-password-link" style="font-size: 14px; color: #666; text-decoration: underline; display: block; margin-top: 25px;">กลับไปที่หน้าเข้าสู่ระบบ</a>
        </div>

    <div id="forgotSection" style="display: none;">
        <div class="back-nav" onclick="showLogin()">
            <span class="back-arrow">←</span>
            <h3>รีเซ็ทรหัสผ่าน</h3>
        </div>

        <p class="instruction-text" style="font-size: 14px; color: #666; margin-bottom: 20px;">
            กรุณากรอกข้อมูลเพื่อตรวจสอบบัญชีของคุณ
        </p>

        <div class="textbox">
            <input id="ForgotUser" required type="text" placeholder=" " />
            <label>ชื่อผู้ใช้ (Username)</label>
        </div>

        <div class="textbox">
            <input id="ForgotContact" required type="text" placeholder=" " />
            <label>อีเมล หรือ เบอร์โทรศัพท์</label>
        </div>

        <button class="action-btn-orange" onclick="handleNextStep()">ต่อไป</button>
    </div>

    <div id="registerSection" style="display: none;">
    </div>
</div>
    <script src="/css/maoi.js"></script>
</body>
</html>
