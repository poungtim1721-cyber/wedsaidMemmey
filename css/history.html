        body { margin: 0; font-family: "Segoe UI", "Sarabun", Tahoma, sans-serif; background: #f5f7fa; color: #1e293b; }

            font-size: 14px; outline: none; font-family: inherit;

        .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #5db7df; box-shadow: 0 0 0 3px rgba(93,183,223,.15); }
        .btn-primary {
            padding: 11px 22px; border: 0; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px;
            background: linear-gradient(100deg, #347da9, #5db7df); cursor: pointer; transition: transform .15s, box-shadow .15s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(52,125,169,.3); }
        .btn-ghost {
            padding: 10px 18px; border: 1px solid #dce9ef; border-radius: 10px; background: #fff; color: #718092;
            font-weight: 600; font-size: 13px; cursor: pointer;
        }
        .btn-ghost:hover { border-color: #f28ba8; color: #d1477b; }
        .btn-danger {
            padding: 11px 22px; border: 0; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px;
            background: #e6597a; cursor: pointer;
        }
        .card-list { display: flex; flex-direction: column; gap: 10px; }
        .item-card {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 16px; border: 1px solid #eef2f6; border-radius: 12px; background: #fbfcfe;
        }
        .item-main { display: flex; flex-direction: column; gap: 3px; }
        .item-title { font-weight: 700; font-size: 15px; color: #244057; }
        .item-sub { font-size: 12px; color: #8b98a8; }
        .item-tag {
            display: inline-block; font-size: 11px; font-weight: 700; color: #347da9;
            background: #e5f4fb; padding: 2px 9px; border-radius: 999px; margin-right: 6px;
        }
        .del-btn {
            border: none; background: none; color: #c7cfd8; font-size: 20px; cursor: pointer; line-height: 1;
            padding: 4px 8px; border-radius: 8px;
        }
        .del-btn:hover { color: #e6597a; background: #fdeef1; }
        .empty-state { text-align: center; padding: 34px 10px; color: #a7b1bd; font-size: 14px; }
        .empty-state .big { font-size: 34px; display: block; margin-bottom: 8px; }
        .settings-row {
            display: flex; align-items: center; justify-content: space-between; padding: 14px 0;
            border-bottom: 1px solid #f0f3f6;
        }
        .settings-row:last-child { border-bottom: 0; }
        .settings-label { font-weight: 700; font-size: 14px; color: #244057; }
        .settings-hint { font-size: 12px; color: #8b98a8; margin-top: 2px; }
        .color-swatch {
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; display: inline-block;
        }
        .color-swatch.selected { border-color: #244057; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #244057; color: #fff; padding: 11px 22px; border-radius: 999px; font-size: 13px;
            opacity: 0; pointer-events: none; transition: .25s; z-index: 5000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>

    <script>
        function loadUsername() {
            var savedName = localStorage.getItem("registeredName");
            var profileNameElement = document.getElementById("profileName");
            if (!profileNameElement) return;
            profileNameElement.innerText = savedName || "日本語";
            var avatarEl = document.getElementById("userAvatar");
            if (avatarEl) {
                avatarEl.innerText = (savedName || "日")[0].toUpperCase();
                var savedColor = localStorage.getItem("userAvatarColor");
                if (savedColor) avatarEl.style.background = savedColor;
            }
        }
        document.addEventListener("DOMContentLoaded", loadUsername);
        function openNav() {
            document.getElementById("mySidebar").style.width = "300px";
        }
        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }
        document.addEventListener("DOMContentLoaded", function () {
            var logoutButton = document.getElementById('logoutBtn');
            if (!logoutButton) return;
            logoutButton.addEventListener('click', function() {
                const confirmLogout = confirm("คุณต้องการออกจากระบบใช่หรือไม่?");
                if (confirmLogout) {
                    localStorage.clear();
                    sessionStorage.clear();
                    alert("ออกจากระบบเรียบร้อยแล้ว!");
                    window.location.href = "index.html";
                }
            });
        });
    </script>

                <p class="page-desc">ติดตามว่าคุณอ่านเรื่องไหนไปถึงตอนไหนแล้วบ้าง</p>

            <form id="histForm">
                <div class="form-row">
                    <input type="text" id="hTitle" placeholder="ชื่อเรื่อง (เช่น 進撃の巨人)" required>
                    <input type="text" id="hChapter" placeholder="อ่านถึงตอน/บทที่ (เช่น ตอนที่ 12)">
                </div>
                <button type="submit" class="btn-primary">บันทึกลงประวัติ</button>
            </form>
        </div>

        <div class="panel">
            <h2>🕘 ประวัติล่าสุด (<span id="histCount">0</span>)</h2>
            <div class="card-list" id="histList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script>
        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1800);
        }
    </script>
    <script>
        const HIST_KEY = "mangaHistory";
        function getHist() { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; }
        function setHist(list) { localStorage.setItem(HIST_KEY, JSON.stringify(list)); }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
            });
        }

        function formatDate(iso) {
            const d = new Date(iso);
            return d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear() + ' • ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }

        function renderHist() {
            const list = getHist();
            const wrap = document.getElementById("histList");
            document.getElementById("histCount").textContent = list.length;
            if (list.length === 0) {
                wrap.innerHTML = '<div class="empty-state"><span class="big">🕘</span>ยังไม่มีประวัติการอ่าน<br>บันทึกเรื่องที่คุณเพิ่งอ่านจบด้านบนได้เลย</div>';
                return;
            }
            wrap.innerHTML = list.map(function(item, i) {
                var progress = (item.page && item.totalPages) ? ('หน้า ' + item.page + '/' + item.totalPages + ' • ') : '';
                var auto = item.mangaId ? '<span class="item-tag">อัตโนมัติ</span>' : '';
                return '<div class="item-card">' +
                    '<div class="item-main">' +
                        '<div class="item-title">' + auto + escapeHtml(item.title) + '</div>' +
                        '<div class="item-sub">' + (item.chapter ? escapeHtml(item.chapter) + ' • ' : '') + progress + formatDate(item.date) + '</div>' +
                    '</div>' +
                    '<button class="del-btn" onclick="removeHist(' + i + ')" title="ลบ">&times;</button>' +
                '</div>';
            }).join("");
        }

        function removeHist(i) {
            const list = getHist();
            list.splice(i, 1);
            setHist(list);
            renderHist();
            showToast("ลบรายการนี้แล้ว");
        }

        document.getElementById("histForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const title = document.getElementById("hTitle").value.trim();
            const chapter = document.getElementById("hChapter").value.trim();
            if (!title) return;
            const list = getHist();
            list.unshift({ title: title, chapter: chapter, date: new Date().toISOString() });
            setHist(list);
            this.reset();
            renderHist();
            showToast("บันทึกประวัติแล้ว");
        });

        document.getElementById("clearHistoryBtn").addEventListener("click", function() {
            if (getHist().length === 0) return;
            if (confirm("ต้องการล้างประวัติการอ่านทั้งหมดใช่หรือไม่?")) {
                setHist([]);
                renderHist();
                showToast("ล้างประวัติแล้ว");
            }
        });

        renderHist();
    </script>
