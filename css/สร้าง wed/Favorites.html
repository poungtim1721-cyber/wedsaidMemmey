<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みさこ | สิ่งที่ชอบ</title>
    <style>
        body { margin: 0; font-family: "Segoe UI", "Sarabun", Tahoma, sans-serif; background: #f5f7fa; color: #1e293b; }
        .page-wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 60px; }
        .page-title { font-size: 26px; font-weight: 800; margin: 0 0 6px; color: #244057; }
        .page-desc { color: #718092; margin: 0 0 26px; font-size: 14px; }
        .panel { background: #fff; border-radius: 16px; padding: 22px 24px; box-shadow: 0 6px 18px rgba(52,125,169,.08); margin-bottom: 22px; }
        .panel h2 { font-size: 16px; margin: 0 0 16px; color: #347da9; }
        .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .form-row input, .form-row select, .form-row textarea {
            flex: 1 1 160px; padding: 11px 13px; border: 1px solid #dce9ef; border-radius: 10px;
            font-size: 14px; outline: none; font-family: inherit;
        }
        .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #5db7df; box-shadow: 0 0 0 3px rgba(93,183,223,.15); }
        .btn-primary {
            padding: 11px 22px; border: 0; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px;
            background: linear-gradient(100deg, #347da9, #5db7df); cursor: pointer; transition: transform .15s, box-shadow .15s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(52,125,169,.3); }
        .btn-ghost {
            padding: 10px 18px; border: 1px solid #dce9ef; border-radius: 10px; background: #fff; color: #718092;
            font-weight: 600; font-size: 13px; cursor: pointer;
        }
        .btn-ghost:hover { border-color: #f28ba8; color: #d1477b; }
        .btn-danger {
            padding: 11px 22px; border: 0; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px;
            background: #e6597a; cursor: pointer;
        }
        .card-list { display: flex; flex-direction: column; gap: 10px; }
        .item-card {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 16px; border: 1px solid #eef2f6; border-radius: 12px; background: #fbfcfe;
        }
        .item-main { display: flex; flex-direction: column; gap: 3px; }
        .item-title { font-weight: 700; font-size: 15px; color: #244057; }
        .item-sub { font-size: 12px; color: #8b98a8; }
        .item-tag {
            display: inline-block; font-size: 11px; font-weight: 700; color: #347da9;
            background: #e5f4fb; padding: 2px 9px; border-radius: 999px; margin-right: 6px;
        }
        .del-btn {
            border: none; background: none; color: #c7cfd8; font-size: 20px; cursor: pointer; line-height: 1;
            padding: 4px 8px; border-radius: 8px;
        }
        .del-btn:hover { color: #e6597a; background: #fdeef1; }
        .empty-state { text-align: center; padding: 34px 10px; color: #a7b1bd; font-size: 14px; }
        .empty-state .big { font-size: 34px; display: block; margin-bottom: 8px; }
        .settings-row {
            display: flex; align-items: center; justify-content: space-between; padding: 14px 0;
            border-bottom: 1px solid #f0f3f6;
        }
        .settings-row:last-child { border-bottom: 0; }
        .settings-label { font-weight: 700; font-size: 14px; color: #244057; }
        .settings-hint { font-size: 12px; color: #8b98a8; margin-top: 2px; }
        .color-swatch {
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; display: inline-block;
        }
        .color-swatch.selected { border-color: #244057; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #244057; color: #fff; padding: 11px 22px; border-radius: 999px; font-size: 13px;
            opacity: 0; pointer-events: none; transition: .25s; z-index: 5000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
    <link rel="stylesheet" href="profile-pages.css">
</head>
<body>
    <div class="page-wrap">
        <button type="button" class="back-button" id="backButton">← กลับ</button>
        <h1 class="page-title">สิ่งที่ชอบ</h1>
        <p class="page-desc">รวมเรื่องที่คุณถูกใจ จัดหมวดหมู่ไว้ดูภายหลัง</p>

        <div class="panel">
            <h2>➕ เพิ่มรายการโปรด</h2>
            <form id="favForm">
                <div class="form-row">
                    <input type="text" id="fTitle" placeholder="ชื่อเรื่อง " required>
                    <input type="text" id="fCategory" list="categoryOptions" placeholder="หมวดหมู่ ">
                    <datalist id="categoryOptions">
                        <option value="แอคชัน">
                        <option value="โรแมนติก">
                        <option value="แฟนตาซี">
                        <option value="ผจญภัย">
                        <option value="ตลก">
                        <option value="ดราม่า">
                        <option value="สยองขวัญ">
                        <option value="ทั่วไป">
                    </datalist>
                </div>
                <div class="form-row">
                    <input type="text" id="fNote" placeholder="โน้ตสั้นๆ (ไม่บังคับ)" style="flex: 1 1 100%;">
                </div>
                <button type="submit" class="btn-primary">เพิ่มลงรายการโปรด</button>
            </form>
        </div>

        <div class="panel">
            <h2>❤️ รายการที่ชอบ (<span id="favCount">0</span>)</h2>
            <div class="card-list" id="favList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script>
        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1800);
        }
    </script>
    <script>
        const FAV_KEY = "favoriteManga";
        function getFav() { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
        function setFav(list) { localStorage.setItem(FAV_KEY, JSON.stringify(list)); }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
            });
        }

        const DEFAULT_CATEGORIES = ["แอคชัน", "โรแมนติก", "แฟนตาซี", "ผจญภัย", "ตลก", "ดราม่า", "สยองขวัญ", "ทั่วไป"];

        function refreshCategoryOptions() {
            const used = getFav().map(function(item) { return item.category || item.type; }).filter(Boolean);
            const all = Array.from(new Set(DEFAULT_CATEGORIES.concat(used)));
            document.getElementById("categoryOptions").innerHTML =
                all.map(function(c) { return '<option value="' + escapeHtml(c) + '">'; }).join("");
        }

        function renderFav() {
            const list = getFav();
            const wrap = document.getElementById("favList");
            document.getElementById("favCount").textContent = list.length;
            refreshCategoryOptions();
            if (list.length === 0) {
                wrap.innerHTML = '<div class="empty-state"><span class="big">💗</span>ยังไม่มีรายการโปรด<br>กดเพิ่มเรื่องที่คุณชอบด้านบนได้เลย</div>';
                return;
            }
            wrap.innerHTML = list.map(function(item, i) {
                var category = item.category || item.type || "ทั่วไป";
                var auto = item.mangaId ? '<span class="item-tag">อัตโนมัติ</span>' : '';
                return '<div class="item-card">' +
                    '<div class="item-main">' +
                        '<div class="item-title">' + auto + '<span class="item-tag">' + escapeHtml(category) + '</span>' + escapeHtml(item.title) + '</div>' +
                        (item.note ? '<div class="item-sub">' + escapeHtml(item.note) + '</div>' : '') +
                    '</div>' +
                    '<button class="del-btn" onclick="removeFav(' + i + ')" title="ลบ">&times;</button>' +
                '</div>';
            }).join("");
        }

        function removeFav(i) {
            const list = getFav();
            list.splice(i, 1);
            setFav(list);
            renderFav();
            showToast("ลบออกจากรายการโปรดแล้ว");
        }

        document.getElementById("favForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const title = document.getElementById("fTitle").value.trim();
            const category = document.getElementById("fCategory").value.trim() || "ทั่วไป";
            const note = document.getElementById("fNote").value.trim();
            if (!title) return;
            const list = getFav();
            list.unshift({ title: title, category: category, note: note, date: new Date().toISOString() });
            setFav(list);
            this.reset();
            renderFav();
            showToast("เพิ่มลงรายการโปรดแล้ว");
        });

        document.getElementById("backButton").addEventListener("click", function() {
            if (window.history.length > 1) window.history.back();
            else window.location.href = "home.html";
        });

        renderFav();
    </script>
</body>
</html>
