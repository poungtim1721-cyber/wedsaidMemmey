<script>
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    let currentIndex = 0;
    let slideInterval;

    // ฟังก์ชันจัดการตำแหน่งและคลาสของแต่ละรูป
    function updateSlider() {
        slides.forEach((slide, index) => {
            // ลบคลาสเก่าออกก่อน
            slide.classList.remove('active', 'prev', 'next');
            
            // คำนวณหาลำดับภาพก่อนหน้าและถัดไป เพื่อทำระบบลูป
            let prevIndex = (currentIndex - 1 + slides.length) % slides.length;
            let nextIndex = (currentIndex + 1) % slides.length;

            // กำหนดคลาสใหม่ตามตำแหน่ง
            if (index === currentIndex) {
                slide.classList.add('active'); // รูปตรงกลาง
            } else if (index === prevIndex) {
                slide.classList.add('prev');   // รูปซ้าย
            } else if (index === nextIndex) {
                slide.classList.add('next');   // รูปขวา
            }
        });

        // อัปเดตจุดไข่ปลา
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentIndex);
        });
    }

    // ฟังก์ชันเลื่อนไปยังภาพถัดไป
    function nextSlide() {
        currentIndex = (currentIndex + 1) % slides.length;
        updateSlider();
    }

    // ฟังก์ชันเมื่อคลิกเลือกรูปหรือจุดไข่ปลา
    function goToSlide(index) {
        currentIndex = index;
        updateSlider();
        resetInterval(); // รีเซ็ตเวลาเลื่อนอัตโนมัติเมื่อมีการคลิก
    }

    // ฟังก์ชันตั้งเวลาเลื่อนอัตโนมัติ
    function resetInterval() {
        clearInterval(slideInterval);
        slideInterval = setInterval(nextSlide, 3500); // 3500 คือ 3.5 วินาที เปลี่ยนแปลงได้
    }

    // เริ่มต้นทำงาน
    updateSlider();
    resetInterval();
    </script>
    <script>
window.addEventListener('load', function() {
    const container = document.getElementById('mangaSlider');
    const track = document.getElementById('mangaTrack');
    const slides = Array.from(track.children);
    const prevBtn = document.getElementById('mangaPrevBtn');
    const nextBtn = document.getElementById('mangaNextBtn');
    const dotsContainer = document.getElementById('mangaDots');

    if (!container || !track || slides.length === 0) return;

    let currentIndex = 0;
    let startX = 0;
    let currentTranslate = 0;
    let prevTranslate = 0;
    let isDragging = false;
    let autoPlayTimer = null;
    const autoPlayDelay = 3500; // เวลาเลื่อนอัตโนมัติ 3.5 วินาที

    // 1. สร้างปุ่มตัวเลข 1, 2, 3, 4 ตามจำนวนรูป
    dotsContainer.innerHTML = '';
    slides.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = `manga-dot ${i === 0 ? 'active' : ''}`;
        dot.textContent = i + 1;
        
        // ผูกคำสั่งคลิกเปลี่ยนหน้า
        dot.addEventListener('click', (e) => {
            e.stopPropagation();
            goToSlide(i);
        });

        dotsContainer.appendChild(dot);
    });
    const dots = Array.from(dotsContainer.children);

    // 2. ฟังก์ชันคำนวณตำแหน่งและอัปเดตหน้า
    function updateSlider() {
        const slideWidth = slides[0].offsetWidth;
        const containerWidth = container.offsetWidth;
        const margin = slideWidth * 0.03;
        const totalSlideWidth = slideWidth + margin;

        const centerOffset = (containerWidth - slideWidth) / 2;
        currentTranslate = centerOffset - (currentIndex * totalSlideWidth);
        prevTranslate = currentTranslate;

        track.style.transition = isDragging ? 'none' : 'transform 0.4s ease-out';
        track.style.transform = `translateX(${currentTranslate}px)`;

        slides.forEach((slide, idx) => slide.classList.toggle('active', idx === currentIndex));
        dots.forEach((dot, idx) => dot.classList.toggle('active', idx === currentIndex));
    }

    function goToSlide(index) {
        currentIndex = index;
        updateSlider();
        startAutoPlay();
    }

    function nextSlide() {
        currentIndex = (currentIndex + 1) % slides.length;
        updateSlider();
    }

    function prevSlide() {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        updateSlider();
    }

    // 3. ระบบตั้งเวลาเลื่อนอัตโนมัติ
    function startAutoPlay() {
        stopAutoPlay();
        autoPlayTimer = setInterval(nextSlide, autoPlayDelay);
    }

    function stopAutoPlay() {
        if (autoPlayTimer) clearInterval(autoPlayTimer);
    }

    // 4. ปุ่มลูกศร
    if (nextBtn) nextBtn.addEventListener('click', () => { nextSlide(); startAutoPlay(); });
    if (prevBtn) prevBtn.addEventListener('click', () => { prevSlide(); startAutoPlay(); });

    // 5. ระบบจับการลากเมาส์ / สัมผัสนิ้วปัดหน้าจอ
    function onStart(e) {
        isDragging = true;
        startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        stopAutoPlay();
    }

    function onMove(e) {
        if (!isDragging) return;
        const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const diff = currentX - startX;
        track.style.transition = 'none';
        track.style.transform = `translateX(${prevTranslate + diff}px)`;
    }

    function onEnd(e) {
        if (!isDragging) return;
        isDragging = false;
        const endX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
        const diff = endX - startX;

        // ระยะปัดเกิน 40px ให้เปลี่ยนภาพ
        if (diff < -40) {
            nextSlide();
        } else if (diff > 40) {
            prevSlide();
        } else {
            updateSlider();
        }
        startAutoPlay();
    }

    track.addEventListener('mousedown', onStart);
    track.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    track.addEventListener('touchstart', onStart, { passive: true });
    track.addEventListener('touchmove', onMove, { passive: true });
    track.addEventListener('touchend', onEnd);

    window.addEventListener('resize', updateSlider);

    // เริ่มทำงานระบบ
    updateSlider();
    startAutoPlay();
});
</script>

<script>
window.addEventListener('load', function() {
    const row = document.getElementById('mangaRow');
    const leftBtn = document.getElementById('rowLeftBtn');
    const rightBtn = document.getElementById('rowRightBtn');
        if (!row || !leftBtn || !rightBtn) return;
// ระยะทางเลื่อนต่อการกด 1 ครั้ง (เลื่อนตามความกว้างของกรอบแสดงผล)
    const getScrollDistance = () => row.clientWidth * 0.85;
// ปุ่มกดไปทางขวา (ข้ามไปเรื่อง 7+)
    rightBtn.addEventListener('click', () => {
        const maxScrollLeft = row.scrollWidth - row.clientWidth;
        
        // ถ้าเลื่อนจนสุดแถวแล้ว ให้วนกลับไปเรื่องแรก
        if (Math.ceil(row.scrollLeft) >= maxScrollLeft - 5) {
            row.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
            row.scrollBy({ left: getScrollDistance(), behavior: 'smooth' });
        }
    });
// ปุ่มกดไปทางซ้าย
leftBtn.addEventListener('click', () => {
        // ถ้าอยู่เรื่องแรกสุด กดซ้ายจะวนไปเรื่องสุดท้าย
    if (row.scrollLeft <= 5) {
        row.scrollTo({ left: row.scrollWidth, behavior: 'smooth' });
    } else {
        row.scrollBy({ left: -getScrollDistance(), behavior: 'smooth' });
    }
});
});
