<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/responsive.css" media="screen">
  <meta name="description" content="รวมรายการมังงะทั้งหมด พร้อมจำนวนเรื่องและลิงก์สำหรับเข้าชม">
  <title>มังงะทั้งหมด | みさこ</title>
  <style>
    :root {
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #1e293b;
      background: #f5f8fc;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    .page-header {
      padding: 18px 24px;
      background: #fff;
      border-bottom: 1px solid #e5eaf1;
    }

    .header-content,
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #1769d3;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }

    main { padding: 36px 0 56px; }

    .page-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      color: #12315c;
      font-size: clamp(1.7rem, 4vw, 2.3rem);
    }

    .page-description {
      margin: 6px 0 0;
      color: #64748b;
    }

    .manga-count {
      flex: 0 0 auto;
      padding: 9px 15px;
      border: 1px solid #cfe0fb;
      border-radius: 999px;
      color: #1455a5;
      background: #eaf3ff;
      font-weight: 700;
    }

    .manga-search {
      width: 100%;
      margin-bottom: 20px;
      padding: 13px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      color: #1e293b;
      background: #fff;
      font: inherit;
    }

    .manga-search:focus-visible {
      outline: 3px solid rgba(23, 105, 211, 0.25);
      border-color: #1769d3;
    }

    .manga-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
    }

    .manga-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #e5eaf1;
      border-radius: 14px;
      color: inherit;
      background: #fff;
      box-shadow: 0 5px 18px rgba(31, 53, 84, 0.06);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .manga-card:hover,
    .manga-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 12px 26px rgba(31, 53, 84, 0.14);
    }

    .manga-card:focus-visible {
      outline: 3px solid rgba(23, 105, 211, 0.4);
      outline-offset: 3px;
    }

    .manga-cover {
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #e9eef5;
    }

    .manga-cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .manga-details { padding: 13px 14px 15px; }

    .manga-title {
      margin: 0;
      color: #12315c;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .manga-title rt {
      color: #64748b;
      font-size: 0.62em;
      font-weight: 500;
    }

    .manga-translation {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 0.84rem;
      line-height: 1.6;
    }

    .manga-note {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 32px 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      color: #64748b;
      text-align: center;
    }

    @media (max-width: 520px) {
      .page-header { padding: 15px 16px; }
      main { padding-top: 26px; }
      .page-heading { align-items: start; flex-direction: column; }
      .manga-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .manga-card { transition: none; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="header-content">
      <a class="back-link" href="/home.html" aria-label="กลับหน้า Home">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3 2.5 11h2.8v9h5.1v-5.8h3.2V20h5.1v-9h2.8L12 3z"/></svg>
        กลับหน้าหลัก
      </a>
    </div>
  </header>

  <main>
    <div class="page-heading">
      <div>
        <h1>มังงะทั้งหมด</h1>
        <p class="page-description">เลือกเรื่องที่ต้องการดูจากรายการด้านล่าง</p>
      </div>
      <div class="manga-count" id="mangaCount" aria-live="polite">กำลังโหลดรายการ...</div>
    </div>
    <input
      class="manga-search"
      id="mangaSearch"
      type="search"
      placeholder="ค้นหาชื่อมังงะ..."
      aria-label="ค้นหามังงะจากชื่อหรือคำสำคัญ"
      autocomplete="off"
    >
    <p class="empty-state" id="mangaNoResults" hidden>ไม่พบมังงะที่ตรงกับคำค้นหา</p>
    <section class="manga-grid" id="mangaGrid" aria-label="รายการมังงะ"></section>
  </main>

  <script src="data/manga-catalog.js"></script>
  <script>
    const mangaGrid = document.getElementById('mangaGrid');
    const mangaCount = document.getElementById('mangaCount');
    const mangaSearch = document.getElementById('mangaSearch');
    const mangaNoResults = document.getElementById('mangaNoResults');
    const catalog = window.siteMangaCatalog;

    if (!Array.isArray(catalog)) {
      mangaCount.textContent = 'โหลดรายการมังงะไม่สำเร็จ';
      const errorMessage = document.createElement('p');
      errorMessage.className = 'empty-state';
      errorMessage.textContent = 'ไม่พบข้อมูลรายการมังงะ กรุณาลองโหลดหน้าอีกครั้ง';
      mangaGrid.append(errorMessage);
    } else {
      mangaCount.textContent = `ทั้งหมด ${catalog.length} เรื่อง`;

      if (catalog.length === 0) {
        const emptyMessage = document.createElement('p');
        emptyMessage.className = 'empty-state';
        emptyMessage.textContent = 'ยังไม่มีรายการมังงะ';
        mangaGrid.append(emptyMessage);
      }

      catalog.forEach((manga) => {
        const card = document.createElement('a');
        card.className = 'manga-card';
        card.href = manga.href;
        card.dataset.search = [
          manga.title,
          manga.titleKana,
          manga.titleThai,
          manga.note,
          ...(manga.keywords || [])
        ]
          .filter(Boolean)
          .join(' ')
          .toLocaleLowerCase();

        const cover = document.createElement('div');
        cover.className = 'manga-cover';
        const image = document.createElement('img');
        image.src = manga.image;
        image.alt = manga.title;
        image.loading = 'lazy';
        cover.append(image);

        const details = document.createElement('div');
        details.className = 'manga-details';
        const title = document.createElement('h2');
        title.className = 'manga-title';
        title.lang = 'ja';
        const rubyTitle = document.createElement('ruby');
        const baseText = document.createElement('rb');
        baseText.textContent = manga.title;
        rubyTitle.append(baseText);
        if (manga.titleKana) {
          const reading = document.createElement('rt');
          reading.textContent = manga.titleKana;
          rubyTitle.append(reading);
        }
        title.append(rubyTitle);
        details.append(title);

        if (manga.titleThai) {
          const translation = document.createElement('p');
          translation.className = 'manga-translation';
          translation.lang = 'th';
          translation.textContent = manga.titleThai;
          details.append(translation);
        }

        if (manga.note) {
          const note = document.createElement('p');
          note.className = 'manga-note';
          note.textContent = manga.note;
          details.append(note);
        }

        card.append(cover, details);
        mangaGrid.append(card);
      });

      mangaSearch.addEventListener('input', () => {
        const query = mangaSearch.value.trim().toLocaleLowerCase();
        const cards = mangaGrid.querySelectorAll('.manga-card');
        let visibleCount = 0;

        cards.forEach((card) => {
          const matches = card.dataset.search.includes(query);
          card.hidden = !matches;
          if (matches) visibleCount += 1;
        });

        mangaCount.textContent = query
          ? `พบ ${visibleCount} จากทั้งหมด ${catalog.length} เรื่อง`
          : `ทั้งหมด ${catalog.length} เรื่อง`;
        mangaNoResults.hidden = !query || visibleCount > 0;
      });
    }
  </script>
</body>
</html>
